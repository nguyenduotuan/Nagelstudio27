<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nagelstudio 27 – Termin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/main.css" />
    <script type="module" src="../scripts/booking.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../../index.html" data-shop="name"></a>
      <nav aria-label="Main">
        <a href="../../index.html" data-i18n="nav.home">Startseite</a>
        <a href="prices.html" data-i18n="nav.prices">Preisliste</a>
        <a href="contact.html" data-i18n="nav.contact">Kontakt</a>
      </nav>
      <div class="languages" role="group" aria-label="Language">
        <button type="button" data-language="de">DE</button>
        <button type="button" data-language="en">EN</button>
        <button type="button" data-language="vi">VI</button>
      </div>
    </header>

    <main>
      <section class="section narrow">
        <h1 data-i18n="booking.title"></h1>
        <p class="hint" data-i18n="booking.intro"></p>

        <form id="booking-form" class="form">
          <label for="name" data-i18n="booking.name"></label>
          <input id="name" name="name" type="text" autocomplete="name" required />

          <label for="phone" data-i18n="booking.phone"></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" required />

          <label for="phone-confirmation" data-i18n="booking.phoneConfirm"></label>
          <input id="phone-confirmation" name="phoneConfirmation" type="tel" autocomplete="tel" required />

          <div class="booking-datetime">
            <div class="booking-field">
              <label for="appointment-date" data-i18n="booking.date"></label>
              <input id="appointment-date" name="appointmentDate" type="date" required />
            </div>
            <div class="booking-field">
              <label for="appointment-time" data-i18n="booking.time"></label>
              <input id="appointment-time" name="appointmentTime" type="time" lang="de" />
            </div>
          </div>

          <label for="request" data-i18n="booking.request"></label>
          <textarea id="request" name="request" rows="5" required></textarea>

          <div class="booking-honeypot" aria-hidden="true">
            <label for="website">Website</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>

          <button class="button" type="submit" data-i18n="booking.submit"></button>
          <p id="booking-status" role="status"></p>
        </form>

        <div class="actions">
          <a class="button button-secondary" data-shop-call href="#" data-i18n="action.call"></a>
        </div>
      </section>
    </main>
  </body>
</html>
