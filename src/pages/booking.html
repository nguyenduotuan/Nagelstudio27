<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nagelstudio 27 – Termin</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <script type="module" src="../scripts/booking.js"></script>
  </head>
  <body data-page="booking" data-root="../../">
    <header id="site-header"></header>
    <main class="page page-booking">
        <h1 class="page-title" data-i18n="booking.title"></h1>
        <p class="hint" data-i18n="booking.intro"></p>
        <p class="hint" data-i18n="booking.terms"></p>

        <form id="booking-form" class="form">
          <label for="name" data-i18n="booking.name"></label>
          <input id="name" name="name" type="text" autocomplete="name" required />

          <label for="phone" data-i18n="booking.phone"></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" required />

          <label for="phone-confirmation" data-i18n="booking.phoneConfirm"></label>
          <input id="phone-confirmation" name="phoneConfirmation" type="tel" autocomplete="tel" required />

          <div class="booking-datetime">
            <div class="booking-field">
              <label for="appointment-date" data-i18n="booking.date"></label>
              <input id="appointment-date" name="appointmentDate" type="date" required />
            </div>
            <div class="booking-field">
              <label for="appointment-time" data-i18n="booking.time"></label>
              <input id="appointment-time" name="appointmentTime" type="time" lang="de" />
            </div>
          </div>

          <label for="request" data-i18n="booking.request"></label>
          <textarea id="request" name="request" rows="5" required></textarea>

          <div class="booking-honeypot" aria-hidden="true">
            <label for="website">Website</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>

          <button class="btn" type="submit" data-i18n="booking.submit"></button>
          <p id="booking-status" role="status"></p>
        </form>

        <p class="page-cta">
          <a class="btn btn-outline" data-shop-call href="#" data-i18n="action.call"></a>
        </p>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
