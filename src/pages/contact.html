<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nagelstudio 27 – Kontakt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/main.css" />
    <script type="module" src="../scripts/contact.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../../index.html" data-shop="name"></a>
      <nav aria-label="Main">
        <a href="../../index.html" data-i18n="nav.home">Startseite</a>
        <a href="prices.html" data-i18n="nav.prices">Preisliste</a>
        <a href="contact.html" data-i18n="nav.contact">Kontakt</a>
      </nav>
      <div class="languages" role="group" aria-label="Language">
        <button type="button" data-language="de">DE</button>
        <button type="button" data-language="en">EN</button>
        <button type="button" data-language="vi">VI</button>
      </div>
    </header>

    <main>
      <section class="section narrow">
        <h1 data-i18n="nav.contact"></h1>

        <div class="contact-split">
          <div>
            <h2 data-i18n="contact.address"></h2>
            <p class="address" data-shop="address"></p>

            <h2 data-i18n="contact.phone"></h2>
            <p data-shop="phone"></p>

            <p class="hint" data-i18n="contact.callHint"></p>
            <div class="actions">
              <a class="button" data-shop-call href="#" data-i18n="action.call"></a>
              <a class="button button-secondary" href="booking.html" data-i18n="action.book"></a>
            </div>
          </div>
          <div class="contact-hours">
            <h2 data-i18n="hours.title"></h2>
            <ul class="hours" data-hours></ul>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
